services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netcontrol
      POSTGRES_USER: netcontrol
      POSTGRES_PASSWORD: netcontrol
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcontrol -d netcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://netcontrol:netcontrol@postgres:5432/netcontrol?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/migrations:/migrations:ro

  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://netcontrol_app:netcontrol_app@postgres:5432/netcontrol?sslmode=disable
      HTTP_ADDRESS: :8080
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-development-only-secret-change-me-now}
      APPLICATION_FQDN: ${APPLICATION_FQDN:-localhost}
      ACS_FQDN: ${ACS_FQDN:-acs.localhost}
      ACS_DEFAULT_TENANT_SLUG: ${ACS_DEFAULT_TENANT_SLUG:-netcontrol}
      WIFI_ENCRYPTION_KEY: ${WIFI_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      COMMAND_PROCESSING_TIMEOUT: ${COMMAND_PROCESSING_TIMEOUT:-5m}
      COMMAND_RETRY_INTERVALS: ${COMMAND_RETRY_INTERVALS:-30s,2m,10m}
      ACS_ONLINE_TIMEOUT: ${ACS_ONLINE_TIMEOUT:-10m}
      ACS_OFFLINE_TIMEOUT: ${ACS_OFFLINE_TIMEOUT:-24h}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: dockerfiles/worker.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://netcontrol_app:netcontrol_app@postgres:5432/netcontrol?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-development-only-secret-change-me-now}
      APPLICATION_FQDN: ${APPLICATION_FQDN:-localhost}
      ACS_FQDN: ${ACS_FQDN:-acs.localhost}
      ACS_DEFAULT_TENANT_SLUG: ${ACS_DEFAULT_TENANT_SLUG:-netcontrol}
      WIFI_ENCRYPTION_KEY: ${WIFI_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      COMMAND_PROCESSING_TIMEOUT: ${COMMAND_PROCESSING_TIMEOUT:-5m}
      COMMAND_RETRY_INTERVALS: ${COMMAND_RETRY_INTERVALS:-30s,2m,10m}
      ACS_ONLINE_TIMEOUT: ${ACS_ONLINE_TIMEOUT:-10m}
      ACS_OFFLINE_TIMEOUT: ${ACS_OFFLINE_TIMEOUT:-24h}
    depends_on:
      migrate:
        condition: service_completed_successfully

  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: dockerfiles/backend.Dockerfile
    entrypoint: ["/netcontrol-bootstrap"]
    environment:
      DATABASE_URL: postgres://netcontrol:netcontrol@postgres:5432/netcontrol?sslmode=disable
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-NetControl}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-netcontrol}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@netcontrol.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
